# 雲端 AI 降噪：App 上傳加密原檔到草稿 Release → 觸發此工作 → SCUNet 降噪 + 同一份修圖引擎全解析度輸出 → 加密回傳
name: cloud-denoise
on:
  repository_dispatch:
    types: [aip-denoise]
  workflow_dispatch:
    inputs:
      release_id: { description: 'Release ID', required: true }
      job: { description: 'Job ID', required: true }
permissions:
  contents: write
concurrency:
  group: aip-${{ github.event.client_payload.job || inputs.job }}
jobs:
  denoise:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 快取模型與套件
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aip
            ~/.cache/pip
          key: aip-v1-${{ hashFiles('cloud/run_job.py') }}
          restore-keys: aip-v1-
      - name: 安裝
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install rawpy numpy einops timm cryptography requests pillow
          cd cloud && npm install --no-audit --no-fund
      - name: 執行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUD_KEY: ${{ secrets.CLOUD_KEY }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.client_payload.release_id || inputs.release_id }}
          JOB: ${{ github.event.client_payload.job || inputs.job }}
        run: python cloud/run_job.py
