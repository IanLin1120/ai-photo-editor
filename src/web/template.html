<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" data-acc="terra">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe5d3">
<title>AI修圖軟體</title>
<style>/*@@GL_CSS@@*/</style>
<style>/*@@APP_CSS@@*/</style>
</head>
<body class="liquid">

<!-- ① 照片庫 -->
<section class="view on" id="v-lib"><div class="scroll">
  <div class="libHead">
    <h2 class="pt grow">📷 照片</h2>
    <button class="btn pri" id="libAdd">＋ 匯入</button>
    <button class="btn" id="libSel">選取</button>
  </div>
  <div class="sub libHint" id="libHint"></div>
  <div id="libGrid"></div>
</div>
<div id="libBar" class="glass hide">
  <span id="libCnt" class="grow"></span>
  <button class="btn sm" data-a="all">全選</button>
  <button class="btn sm" data-a="ai">🤖 AI 自動</button>
  <button class="btn sm" data-a="geo">📍 地點</button>
  <button class="btn sm pri" data-a="exp">📤 匯出</button>
  <button class="btn sm" data-a="del">🗑</button>
</div>
</section>

<!-- ② 編輯 -->
<section class="view" id="v-edit">
  <div id="edTop" class="glass">
    <button class="btn sm" id="edBack">‹ 照片</button>
    <div class="grow edTitle"><b id="edName">尚未開啟照片</b><div class="sub" id="edInfo"></div></div>
    <button class="btn sm" id="edUndo" title="復原">↶</button>
    <button class="btn sm" id="edMenu">⋯</button>
    <button class="btn sm pri" id="edExport">📤</button>
  </div>
  <div id="edStage">
    <canvas id="edCv"></canvas>
    <div id="edBusy" class="hide"><div class="spin"></div><span id="edBusyT">處理中…</span></div>
    <div id="edEmpty" class="sub">在「照片」頁點一張照片開始修圖</div>
    <canvas id="edHist" width="200" height="70" class="glass"></canvas>
    <div id="edBA" class="glass hide">原始</div>
  </div>
  <div id="edPanel" class="glass">
    <div id="edTabs"></div>
    <div id="edTools"></div>
  </div>
</section>

<!-- ③ 地點 -->
<section class="view" id="v-geo">
  <div id="geoMap" class="mapbox"></div>
  <div id="geoTop" class="glass">
    <div class="geoBar">
      <div class="geoIn"><input id="geoQ" placeholder="搜尋地點、地址或座標" autocomplete="off" enterkeyhint="search"><button class="ib" id="geoClr">✕</button></div>
      <button class="btn pri" id="geoGo">搜尋</button>
      <button class="ib round" id="geoMenu">☰</button>
    </div>
    <div id="geoRes"></div>
  </div>
  <div class="fab glass" id="geoLoc" title="目前位置">📍</div>
  <div class="fab glass" id="geo3d" title="2D／3D"><b>3D</b></div>
  <div id="geoCard" class="glass hide"></div>
</section>

<!-- ④ 雲端 AI 降噪 -->
<section class="view" id="v-cloud"><div class="scroll">
  <h2 class="pt">☁️ 雲端 AI 降噪</h2>
  <div class="card glass" id="clIntro"></div>
  <div class="card glass" id="clJobs"></div>
</div></section>

<!-- ⑤ 設定 -->
<section class="view" id="v-set"><div class="scroll">
  <h2 class="pt">⚙️ 設定</h2>
  <div class="card glass" id="sKeys"></div>
  <div class="card glass" id="sCloud"></div>
  <div class="card glass" id="sExport"></div>
  <div class="card glass" id="sAI"></div>
  <div class="card glass" id="sPerm"></div>
  <div class="card glass" id="sLook"></div>
  <div class="card glass" id="sUpd"></div>
  <div class="card glass" id="sAbout"></div>
</div></section>

<nav id="nav" class="glass">
  <button class="btn on" data-v="v-lib"><i>📷</i>照片</button>
  <button class="btn" data-v="v-edit"><i>🎛️</i>編輯</button>
  <button class="btn" data-v="v-geo"><i>📍</i>地點</button>
  <button class="btn" data-v="v-cloud"><i>☁️</i>雲端</button>
  <button class="btn" data-v="v-set"><i>⚙️</i>設定</button>
</nav>
<div id="sheet" class="hide"><div class="shBg"></div><div class="shBox glass"><div class="shGrab"></div><div id="shB"></div></div></div>
<div id="prog" class="hide"><div class="progBox glass"><b id="progT">處理中</b><div class="sub" id="progS"></div><div class="bar"><i id="progB"></i></div><button class="btn sm" id="progX">取消</button></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" multiple accept=".arw,.dng,.nef,.nrw,.cr2,.cr3,.raf,.orf,.rw2,.pef,.srw,.x3f,.3fr,.iiq,.jpg,.jpeg,.tif,.tiff,.png,.heic,image/*" class="hide">

<script type="text/plain" id="wkSrc">/*@@WORKER_JS@@*/</script>
<script>/*@@GL_JS@@*/</script>
<script>/*@@LIB_JS@@*/</script>
<script>/*@@APP_JS@@*/</script>
</body>
</html>
